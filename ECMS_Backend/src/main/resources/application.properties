spring.application.name=ECMS_Backend

# 服务器端口
server.port=8080

# MySQL 数据源
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# !!! 请修改为你的数据库连接地址 !!!
spring.datasource.url=jdbc:mysql://你的服务器IP:3306/ecms_product?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
# !!! 请修改为你的数据库用户名 !!!
spring.datasource.username=你的数据库用户名
# !!! 请修改为你的数据库密码 !!!
spring.datasource.password=你的数据库密码

# DevTools 关闭自动重启（避免连接池问题）
spring.devtools.restart.enabled=false

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.ecms_backend.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JSON 日期格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# 阿里云 OSS
aliyun.oss.endpoint=https://oss-cn-guangzhou.aliyuncs.com
# !!! 请修改为你的OSS Bucket名称 !!!
aliyun.oss.bucket-name=你的OSS Bucket名称
# !!! 请修改为你的OSS AccessKeyId !!!
aliyun.oss.access-key-id=你的OSS AccessKeyId
# !!! 请修改为你的OSS AccessKeySecret !!!
aliyun.oss.access-key-secret=你的OSS AccessKeySecret
